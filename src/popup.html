<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>B站助手</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fa;
        --surface: #ffffff;
        --text: #1f2328;
        --muted: #57606a;
        --border: #d0d7de;
        --accent: #00aeec;
        --accent-strong: #007aa8;
        --accent-soft: #e6f7fd;
        --danger: #b42318;
        --success: #16794c;
        --focus: rgba(0, 174, 236, 0.35);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #0d1117;
          --surface: #161b22;
          --text: #e6edf3;
          --muted: #8b949e;
          --border: #30363d;
          --accent-soft: #123746;
          --danger: #ff7b72;
          --success: #56d364;
          --focus: rgba(0, 174, 236, 0.45);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        min-height: 220px;
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      h3 {
        margin: 0;
        font-size: 18px;
        line-height: 1.3;
        letter-spacing: 0.01em;
      }

      .description {
        margin: 6px 0 16px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      button {
        width: 100%;
        min-height: 40px;
        padding: 9px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease;
      }

      button.primary {
        background: var(--accent-strong);
        color: #fff;
      }

      button.secondary {
        border-color: var(--border);
        background: var(--surface);
        color: var(--text);
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button.primary:hover:not(:disabled) {
        background: #006f98;
      }

      button.secondary:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #msg,
      #status {
        overflow-wrap: anywhere;
      }

      #msg {
        min-height: 21px;
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      #status {
        min-height: 20px;
        margin-top: 8px;
        padding: 9px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      #status:empty {
        display: none;
      }

      #status[data-state="running"] {
        border-color: var(--accent);
        background: var(--accent-soft);
        color: var(--text);
      }

      #status[data-state="done"] {
        border-color: var(--success);
        border-color: color-mix(in srgb, var(--success) 45%, var(--border));
        color: var(--success);
      }

      #status[data-state="error"] {
        border-color: var(--danger);
        border-color: color-mix(in srgb, var(--danger) 45%, var(--border));
        color: var(--danger);
      }

      @media (forced-colors: active) {
        button:focus-visible {
          outline: 2px solid CanvasText;
        }

        #status {
          border-color: CanvasText;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }

        button:hover:not(:disabled),
        button:active:not(:disabled) {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <h3>B站助手</h3>
    <p class="description">按当前播放清晰度下载视频，或导出 M4A 音频。</p>
    <div class="actions">
      <button id="send" class="primary" type="button">下载视频</button>
      <button id="audio" class="secondary" type="button">仅下载音频</button>
      <button id="subtitle" class="secondary" type="button" hidden>复制字幕</button>
    </div>
    <div id="msg" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="status" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="popup.js"></script>
  </body>
</html>
