<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>B站离线舱</title>
    <style>
      body {
        width: 280px;
        padding: 12px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 6px;
        background: #00aeec;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #msg,
      #status {
        margin-top: 10px;
        font-size: 12px;
      }

      #status {
        color: #666;
      }
    </style>
  </head>
  <body>
    <h3>一键下载 4K 视频</h3>
    <button id="send" type="button">开始下载</button>
    <div id="msg" role="status"></div>
    <div id="status" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
